<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV Conversazioni</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 24px 14px 60px;
    }

    .wrap { width: 100%; max-width: 760px; margin: 0 auto; }

    h1 {
      font-size: 1.05rem;
      font-weight: 500;
      color: #888;
      margin-bottom: 20px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-align: center;
    }

    #auth-section {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    input {
      flex: 1 1 180px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 1rem; /* >=16px keeps iOS from zooming on focus */
      padding: 12px 14px;
      outline: none;
    }
    input:focus { border-color: #444; }

    button {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #e0e0e0;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 12px 18px;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    button:hover { background: #222; border-color: #444; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.danger { background: #3a1a1a; border-color: #5c2a2a; color: #e05d5d; }
    button.danger:hover { background: #452020; }

    #toolbar { display: none; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    #toolbar.show { display: flex; }
    #search { flex: 1 1 200px; }
    #meta { font-size: 0.78rem; color: #666; margin-left: auto; }

    #status {
      font-size: 0.85rem;
      padding: 10px 14px;
      border-radius: 8px;
      display: none;
      margin-bottom: 14px;
    }
    #status.success { background: #1d3a2a; color: #5ddb8e; display: block; }
    #status.error   { background: #3a1a1a; color: #e05d5d; display: block; }
    #status.info    { background: #1a1a1a; color: #999; display: block; }

    .conv {
      background: #161616;
      border: 1px solid #262626;
      border-radius: 10px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .conv-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      cursor: pointer;
      user-select: none;
    }
    .conv-head:hover { background: #1c1c1c; }
    .conv-title {
      flex: 1;
      min-width: 0;
      font-size: 0.92rem;
      color: #d8d8d8;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .conv-sub { font-size: 0.72rem; color: #666; margin-top: 3px; white-space: nowrap; }
    .conv-count {
      flex: 0 0 auto;
      font-size: 0.72rem;
      color: #888;
      background: #222;
      border-radius: 20px;
      padding: 3px 9px;
    }
    .chevron { flex: 0 0 auto; color: #555; transition: transform 0.2s; }
    .conv.open .chevron { transform: rotate(90deg); }

    .conv-body { display: none; padding: 4px 16px 14px; }
    .conv.open .conv-body { display: block; }

    .turn { padding: 12px 0; border-top: 1px solid #222; }
    .turn:first-child { border-top: none; }
    .bubble { border-radius: 10px; padding: 10px 13px; font-size: 0.9rem; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; }
    .q { background: #1d2a3a; color: #bcd6f5; margin-bottom: 8px; }
    .a { background: #1a1a1a; color: #d0d0d0; border: 1px solid #242424; }
    .turn-time { font-size: 0.68rem; color: #555; margin-top: 6px; text-align: right; }

    .empty { text-align: center; color: #555; font-size: 0.9rem; padding: 40px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>CV Conversazioni</h1>

    <div id="auth-section">
      <input type="password" id="secret" placeholder="Admin secret" autocomplete="current-password" />
      <button id="load-btn" onclick="load()">Carica</button>
    </div>

    <div id="toolbar">
      <input type="search" id="search" placeholder="Cerca nelle conversazioni…" oninput="render()" />
      <button onclick="load()">↻</button>
      <button class="danger" onclick="clearAll()">Svuota</button>
      <span id="meta"></span>
    </div>

    <div id="status"></div>
    <div id="list"></div>
  </div>

  <script>
    const API = 'https://cv-bot-backend-production.up.railway.app';
    let conversations = [];

    const $ = (id) => document.getElementById(id);
    const secret = () => $('secret').value.trim();

    function setStatus(msg, type) {
      const el = $('status');
      el.textContent = msg;
      el.className = type || '';
      if (!msg) el.className = '';
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function fmtDate(iso) {
      const d = new Date(iso);
      return d.toLocaleString('it-IT', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    }
    function fmtTime(iso) {
      return new Date(iso).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
    }

    async function load() {
      if (!secret()) { setStatus('Inserisci il secret prima.', 'error'); return; }
      $('load-btn').disabled = true;
      setStatus('Carico…', 'info');
      try {
        const res = await fetch(`${API}/admin/conversations`, {
          headers: { 'x-admin-secret': secret() },
        });
        if (!res.ok) throw new Error(res.status === 401 ? 'Secret non valido.' : `Errore ${res.status}`);
        const data = await res.json();
        conversations = data.conversations || [];
        setStatus('', '');
        $('toolbar').classList.add('show');
        render();
      } catch (e) {
        setStatus(e.message, 'error');
      } finally {
        $('load-btn').disabled = false;
      }
    }

    async function clearAll() {
      if (!confirm('Eliminare TUTTE le conversazioni salvate? Operazione irreversibile.')) return;
      try {
        const res = await fetch(`${API}/admin/conversations`, {
          method: 'DELETE',
          headers: { 'x-admin-secret': secret() },
        });
        if (!res.ok) throw new Error(`Errore ${res.status}`);
        conversations = [];
        render();
        setStatus('Conversazioni eliminate.', 'success');
      } catch (e) {
        setStatus(e.message, 'error');
      }
    }

    function render() {
      const q = $('search').value.trim().toLowerCase();
      const list = $('list');

      const filtered = !q ? conversations : conversations.filter((c) =>
        c.turns.some((t) => (t.q + ' ' + t.a).toLowerCase().includes(q)));

      const totalTurns = conversations.reduce((n, c) => n + c.turns.length, 0);
      $('meta').textContent = `${conversations.length} conv · ${totalTurns} scambi`;

      if (filtered.length === 0) {
        list.innerHTML = `<div class="empty">${conversations.length === 0 ? 'Nessuna conversazione salvata.' : 'Nessun risultato.'}</div>`;
        return;
      }

      list.innerHTML = filtered.map((c, i) => {
        const first = c.turns[0];
        const title = first ? esc(first.q) : '(vuota)';
        const turns = c.turns.map((t) => `
          <div class="turn">
            <div class="bubble q">${esc(t.q)}</div>
            <div class="bubble a">${esc(t.a)}</div>
            <div class="turn-time">${fmtTime(t.ts)}</div>
          </div>`).join('');
        return `
          <div class="conv" data-i="${i}">
            <div class="conv-head" onclick="this.parentNode.classList.toggle('open')">
              <div style="flex:1;min-width:0">
                <div class="conv-title">${title}</div>
                <div class="conv-sub">${fmtDate(c.updatedAt)}</div>
              </div>
              <span class="conv-count">${c.turns.length}</span>
              <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
            <div class="conv-body">${turns}</div>
          </div>`;
      }).join('');
    }

    $('secret').addEventListener('keydown', (e) => { if (e.key === 'Enter') load(); });
  </script>
</body>
</html>
