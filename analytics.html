<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV Analytics</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 24px 14px 60px;
    }

    .wrap { width: 100%; max-width: 760px; margin: 0 auto; }

    h1 {
      font-size: 1.05rem;
      font-weight: 500;
      color: #888;
      margin-bottom: 20px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-align: center;
    }

    #auth-section {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    input {
      flex: 1 1 180px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 1rem; /* >=16px keeps iOS from zooming on focus */
      padding: 12px 14px;
      outline: none;
    }
    input:focus { border-color: #444; }

    button {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #e0e0e0;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 12px 18px;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    button:hover { background: #222; border-color: #444; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.danger { background: #3a1a1a; border-color: #5c2a2a; color: #e05d5d; }
    button.danger:hover { background: #452020; }

    #toolbar { display: none; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    #toolbar.show { display: flex; }
    #meta { font-size: 0.78rem; color: #666; margin-left: auto; }

    #status {
      font-size: 0.85rem;
      padding: 10px 14px;
      border-radius: 8px;
      display: none;
      margin-bottom: 14px;
    }
    #status.success { background: #1d3a2a; color: #5ddb8e; display: block; }
    #status.error   { background: #3a1a1a; color: #e05d5d; display: block; }
    #status.info    { background: #1a1a1a; color: #999; display: block; }

    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }
    .kpi {
      background: #161616;
      border: 1px solid #262626;
      border-radius: 10px;
      padding: 14px 16px;
    }
    .kpi-value { font-size: 1.5rem; font-weight: 600; color: #e8e8e8; line-height: 1.2; }
    .kpi-label { font-size: 0.72rem; color: #666; margin-top: 5px; letter-spacing: 0.03em; }
    .kpi-note { font-size: 0.7rem; color: #555; margin-top: 3px; }

    .card {
      background: #161616;
      border: 1px solid #262626;
      border-radius: 10px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .card-head {
      font-size: 0.78rem;
      color: #888;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 14px 16px 10px;
    }
    .card-body { padding: 0 16px 14px; }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-top: 1px solid #202020;
    }
    .row:first-child { border-top: none; }
    .row-label {
      flex: 1;
      min-width: 0;
      font-size: 0.87rem;
      color: #d0d0d0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .row-count {
      flex: 0 0 auto;
      font-size: 0.75rem;
      color: #888;
      background: #222;
      border-radius: 20px;
      padding: 3px 9px;
      font-variant-numeric: tabular-nums;
    }
    .bar {
      flex: 0 0 90px;
      height: 5px;
      background: #222;
      border-radius: 3px;
      overflow: hidden;
    }
    .bar > span { display: block; height: 100%; background: #3d6a8f; }

    .empty { text-align: center; color: #555; font-size: 0.9rem; padding: 40px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>CV Analytics</h1>

    <div id="auth-section">
      <input type="password" id="secret" placeholder="Admin secret" autocomplete="current-password" />
      <button id="load-btn" onclick="load()">Carica</button>
    </div>

    <div id="toolbar">
      <button onclick="load()">↻</button>
      <button class="danger" onclick="clearAll()">Svuota</button>
      <a href="conversations.html" style="color:#666;font-size:0.8rem;text-decoration:none;align-self:center">Conversazioni →</a>
      <span id="meta"></span>
    </div>

    <div id="status"></div>
    <div id="report"></div>
  </div>

  <script>
    const API = 'https://cv-bot-backend-production.up.railway.app';
    let stats = null;

    const $ = (id) => document.getElementById(id);
    const secret = () => $('secret').value.trim();

    function setStatus(msg, type) {
      const el = $('status');
      el.textContent = msg;
      el.className = msg ? (type || '') : '';
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function fmtDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString('it-IT', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    }

    const pct = (n) => Math.round((n || 0) * 100) + '%';

    async function load() {
      if (!secret()) { setStatus('Inserisci il secret prima.', 'error'); return; }
      $('load-btn').disabled = true;
      setStatus('Carico…', 'info');
      try {
        const res = await fetch(`${API}/admin/analytics`, {
          headers: { 'x-admin-secret': secret() },
        });
        if (!res.ok) throw new Error(res.status === 401 ? 'Secret non valido.' : `Errore ${res.status}`);
        stats = await res.json();
        setStatus('', '');
        $('toolbar').classList.add('show');
        render();
      } catch (e) {
        setStatus(e.message, 'error');
      } finally {
        $('load-btn').disabled = false;
      }
    }

    async function clearAll() {
      if (!confirm('Eliminare TUTTI gli eventi raccolti? Operazione irreversibile.')) return;
      try {
        const res = await fetch(`${API}/admin/analytics`, {
          method: 'DELETE',
          headers: { 'x-admin-secret': secret() },
        });
        if (!res.ok) throw new Error(`Errore ${res.status}`);
        await load();
        setStatus('Eventi eliminati.', 'success');
      } catch (e) {
        setStatus(e.message, 'error');
      }
    }

    function kpi(value, label, note) {
      return `<div class="kpi">
        <div class="kpi-value">${esc(value)}</div>
        <div class="kpi-label">${esc(label)}</div>
        ${note ? `<div class="kpi-note">${esc(note)}</div>` : ''}
      </div>`;
    }

    // Ranked list with a bar scaled to the top entry.
    function listCard(title, rows, emptyText) {
      if (!rows || rows.length === 0) {
        return `<div class="card"><div class="card-head">${esc(title)}</div>
          <div class="card-body"><div class="empty">${esc(emptyText)}</div></div></div>`;
      }
      const max = rows[0].count || 1;
      const body = rows.map((r) => `
        <div class="row">
          <div class="row-label" title="${esc(r.label)}">${esc(r.label)}</div>
          <div class="bar"><span style="width:${Math.round((r.count / max) * 100)}%"></span></div>
          <span class="row-count">${r.count}</span>
        </div>`).join('');
      return `<div class="card"><div class="card-head">${esc(title)}</div><div class="card-body">${body}</div></div>`;
    }

    function render() {
      const el = $('report');
      if (!stats || stats.totalEvents === 0) {
        $('meta').textContent = '';
        el.innerHTML = '<div class="empty">Nessun evento raccolto.</div>';
        return;
      }

      $('meta').textContent = `${stats.totalEvents} eventi · fino al ${fmtDate(stats.lastSeen)}`;

      const eng = stats.engagement || {};
      const pro = stats.proactive || {};

      const kpis = `<div class="kpis">
        ${kpi(stats.sessions, 'Sessioni', `dal ${fmtDate(stats.firstSeen)}`)}
        ${kpi(pct(eng.rate), 'Hanno scritto', `${eng.withMessage || 0} su ${eng.sessions || 0}`)}
        ${kpi(eng.messagesPerSession || 0, 'Messaggi / sessione')}
        ${kpi(pro.shown ? pct(pro.rate) : '—', 'Conversione nudge', pro.shown ? `${pro.converted} su ${pro.shown} mostrati` : 'mai mostrato')}
      </div>`;

      const bySource = Object.entries(stats.bySource || {})
        .map(([label, count]) => ({ label, count }))
        .sort((a, b) => b.count - a.count);

      const byName = Object.entries(stats.byName || {})
        .map(([label, count]) => ({ label, count }))
        .sort((a, b) => b.count - a.count);

      const byPage = (stats.byPage || []).map((p) => ({
        label: `${p.page} — ${p.messages} msg`,
        count: p.sessions,
      }));

      el.innerHTML = kpis
        + listCard('Suggerimenti più cliccati', stats.topChips, 'Nessun chip cliccato.')
        + listCard('Domande più frequenti', stats.topQuestions, 'Nessuna domanda registrata.')
        + listCard('Origine delle interazioni', bySource, 'Nessun dato.')
        + listCard('Pagine (sessioni)', byPage, 'Nessun dato.')
        + listCard('Eventi grezzi', byName, 'Nessun dato.');
    }

    $('secret').addEventListener('keydown', (e) => { if (e.key === 'Enter') load(); });
  </script>
</body>
</html>
